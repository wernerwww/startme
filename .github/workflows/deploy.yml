name: Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Ermöglicht manuellen Start

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # ⬅️ Dein Timeout-Wert
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm install
      
      - name: Build
        run: npm run build
      
      # Hier kommen deine Deployment-Schritte
      - name: Deploy
        run: echo "Deployment-Logik hier einfügen"
